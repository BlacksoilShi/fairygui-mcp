name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: python tests/test_helper.py
      - run: python tests/test_publish_owner.py
      - run: python tests/test_recovery_helper.py
